# ./nginx/cdn.conf
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=report_cache:10m max_size=1g inactive=60m;

server {
    listen 80;
    server_name cdn.local;
    
    location /health {
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
    
    location /reports/ {
        proxy_pass http://minio:9000/reports/;
        proxy_cache report_cache;
        proxy_cache_valid 200 1h;
        proxy_cache_key "$request_uri";
        add_header X-Cache-Status $upstream_cache_status;
        
        # Кеширование статики на 1 час
        expires 1h;
        add_header Cache-Control "public, immutable";
    }
}
